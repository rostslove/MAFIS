services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ml-network
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-32768}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ml-network
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${LLM_MODEL:-qwen2.5-coder:32b}"]
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
      additional_contexts:
        fedot_industrial: ${FEDOT_INDUSTRIAL_CONTEXT:-../Fedot.Industrial}
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    networks:
      - ml-network
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-coder:32b}
      - LLM_NUM_CTX=${OLLAMA_CONTEXT_LENGTH:-32768}
      - FEDOT_INDUSTRIAL_PATH=/opt/Fedot.Industrial
      - FEDOT_N_JOBS=${FEDOT_N_JOBS:-0}
      - TRAINING_PROGRESS_LOG_INTERVAL=${TRAINING_PROGRESS_LOG_INTERVAL:-30}
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8502:8501"
    volumes:
      - ./data:/app/data
    networks:
      - ml-network
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=http://backend:8001
    depends_on:
      - backend

networks:
  ml-network:
    driver: bridge

volumes:
  ollama-data:
