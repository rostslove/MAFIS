services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - ml-network
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    entrypoint: /bin/sh -c "ollama serve & sleep 3 && ollama pull llama2 && wait"

  fedot-server:
    build:
      context: .
      dockerfile: fedot.Dockerfile
    container_name: fedot-server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    networks:
      - ml-network
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    networks:
      - ml-network
    environment:
      - PYTHONUNBUFFERED=1
      - FEDOT_HOST=http://fedot-server:8000
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
      - fedot-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8502:8501"
    volumes:
      - ./data:/app/data
    networks:
      - ml-network
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=http://backend:8001
    depends_on:
      - backend

networks:
  ml-network:
    driver: bridge

volumes:
  ollama-models:
  data:
