services:
  fedot-server:
    build:
      context: .
      dockerfile: fedot.Dockerfile
    container_name: fedot-server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    networks:
      - ml-network
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    networks:
      - ml-network
    environment:
      - PYTHONUNBUFFERED=1
      - FEDOT_HOST=http://fedot-server:8000
      - FEDOT_URL=http://fedot-server:8000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      - OPENROUTER_TITLE=Industrial Learning Agent
      - LLM_MODEL=${LLM_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
    depends_on:
      - fedot-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8502:8501"
    volumes:
      - ./data:/app/data
    networks:
      - ml-network
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=http://backend:8001
    depends_on:
      - backend

networks:
  ml-network:
    driver: bridge

volumes:
  data:
