services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
      additional_contexts:
        fedot_industrial: ${FEDOT_INDUSTRIAL_CONTEXT:-../Fedot.Industrial}
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    networks:
      - ml-network
    environment:
      - PYTHONUNBUFFERED=1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      - OPENROUTER_TITLE=GraphAutoML Agent
      - LLM_MODEL=${LLM_MODEL:-qwen/qwen3-coder:free}
      - FEDOT_INDUSTRIAL_PATH=/opt/Fedot.Industrial
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8502:8501"
    volumes:
      - ./data:/app/data
    networks:
      - ml-network
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=http://backend:8001
    depends_on:
      - backend

networks:
  ml-network:
    driver: bridge
